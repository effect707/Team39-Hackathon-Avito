x-backend-environment: &backend-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-queue}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-queue}?sslmode=disable
  HTTP_ADDRESS: :8080
  METRICS_ADDRESS: "${METRICS_ADDRESS:-:9090}"
  DEMO_MODE: ${DEMO_MODE:-true}
  WORKER_INTERVAL: ${WORKER_INTERVAL:-30s}
  DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
  DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
  DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-5m}

x-backend-service: &backend-service
  image: ghcr.io/effect707/team39-hackathon-avito-backend:${IMAGE_TAG:?IMAGE_TAG is required}
  environment: *backend-environment
  depends_on:
    migrate:
      condition: service_completed_successfully
  networks:
    - application
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-queue}
      POSTGRES_USER: ${POSTGRES_USER:-queue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - application
    restart: unless-stopped

  migrate:
    image: ghcr.io/effect707/team39-hackathon-avito-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    entrypoint: ["/migrate"]
    command: ["up"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application
    restart: "no"

  api-1:
    <<: *backend-service
    entrypoint: ["/api"]
    ports:
      - "${API_1_PORT:-80}:8080"

  api-2:
    <<: *backend-service
    entrypoint: ["/api"]
    ports:
      - "127.0.0.1:${API_2_PORT:-8081}:8080"

  worker:
    <<: *backend-service
    entrypoint: ["/worker"]

volumes:
  postgres-data:

networks:
  application:
    driver: bridge
