x-backend-environment: &backend-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-queue}:${POSTGRES_PASSWORD:-queue_dev_password}@postgres:5432/${POSTGRES_DB:-queue}?sslmode=disable
  HTTP_ADDRESS: :8080
  DEMO_MODE: ${DEMO_MODE:-true}
  WORKER_INTERVAL: ${WORKER_INTERVAL:-30s}
  DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
  DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
  DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-5m}

x-backend-service: &backend-service
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment: *backend-environment
  depends_on:
    migrate:
      condition: service_completed_successfully
  networks:
    - application
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-queue}
      POSTGRES_USER: ${POSTGRES_USER:-queue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-queue_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - application
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/migrate"]
    command: ["up"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application
    restart: "no"

  api-1:
    <<: *backend-service
    entrypoint: ["/api"]

  api-2:
    <<: *backend-service
    entrypoint: ["/api"]

  worker:
    <<: *backend-service
    entrypoint: ["/worker"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - application
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api-1
      - api-2
      - frontend
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - application
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  application:
    driver: bridge
